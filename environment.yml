# CellVOCAL conda environment.
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
#
# Core stack covers CellVOCAL training, simulation generators, the external-data
# example, reference notebooks, and shared plotting/evaluation tools.

name: cellvocal
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # External-data notebook tutorial.
  - jupyterlab
  - ipykernel
  - numpy>=1.24
  - scipy
  - pandas
  - matplotlib-base
  - h5py
  - networkx
  - scikit-learn
  - statsmodels
  - tqdm
  - scanpy>=1.9
  - anndata>=0.9
  - python-igraph
  - leidenalg
  # Source-data workbook generation and loom conversion.
  - openpyxl
  - loompy
  - pip:
      - torch>=2.0
      - torch-geometric>=2.4
      # Used by CellVOCAL's velocity visualisation/metrics and direction simulation.
      - scvelo>=0.2.5
      - topovelo
